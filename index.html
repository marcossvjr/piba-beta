<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PIBA • Discipulados</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg1: #ffffff;
            --bg2: #B3AB80;
            --bg3: #f9ffebf2;
            --panel: #ffffff;
            --muted: #949db2;
            --text: #000000;
            --accent: #B2CB3C;
            --ok: #22c55e;
            --warn: #ef4444;
            --line: #888;
            --chip: #FAEEDB;
            --focus: 0 0 0 3px rgb(178 203 60 / 75%);
            --radius: 8px;
            --btnColor: #000;
            --h1Color: #fff;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: linear-gradient(180deg,var(--bg1),var(--bg3));
            color: var(--text);
            font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial;
            min-height: 100dvh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(8px);
            background: rgba(15,17,21,.85);
            border-bottom: 1px solid var(--line);
        }

        .h1 {
            color: var(--h1Color);
            font-size: 16px;
            margin: 0;
        }

        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 14px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .brand {
            font-weight: 700;
            display: flex;
            gap: 10px;
            align-items: center
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: conic-gradient(from 210deg,#7c5cff,#5cc8ff,#7c5cff)
        }

        .right {
            margin-left: auto;
            display: flex;
            gap: 10px;
            align-items: center
        }

        button {
            padding: 8px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--line);
            background: transparent;
            color: var(--text);
            cursor: pointer
        }

        .btn {
            color: var(--btnColor);
        }

            .btn.primary {
                background: var(--accent);
                border-color: transparent;
                color: #0a0a0a;
                font-weight: 700
            }

            .btn.warn {
                background: rgba(239,68,68,.12);
                border-color: #5e2323
            }

            .btn.ok {
                background: rgba(34,197,94,.14);
                border-color: var(--focus)
            }

        .hidden {
            display: none !important
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 12px;
            border-radius: var(--radius);
            border: 1px solid var(--line);
            background: var(--panel)
        }

        input, select {
            padding: 8px 10px;
            border-radius: var(--radius);
            border: 1px solid var(--line);
            background: transparent;
            color: var(--text)
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(12,1fr);
            gap: 12px;
            margin-top: 14px;
        }

        .card {
            grid-column: span 3;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px
        }

        .table-card {
            grid-column: 1 / -1;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: auto;
            padding: 0
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid var(--line);
            text-align: left
        }

        thead th {
            position: sticky;
            top: 0;
            background: var(--panel);
            z-index: 2;
            font-weight: 700;
            color: #a7b0c7
        }

        .mono {
            font-family: ui-monospace, Menlo, Monaco, monospace;
            color: #cbd5e1;
            font-size: 12px
        }

        dialog {
            width: min(920px,96vw);
            border-radius: var(--radius);
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--line);
            padding: 0
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid var(--line)
        }

        .modal-body {
            padding: 12px
        }

        .form-signup-person {
        }

            .form-signup-person .field {
                width: 100%;
            }

        .footer {
            padding: 12px;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: flex-end;
            gap: 8px
        }

        .help {
            color: #93a0bf;
            font-size: 13px
        }

        @media(max-width:800px) {
            .card {
                grid-column: span 6
            }

            @media(max-width:520px) {
                .card {
                    grid-column: span 12
                }
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="wrap">
            <div class="brand"><span class="dot"></span><h1 class="h1"> PIBA • Discipulados</h1></div>
            <div class="right">
                <div id="authArea" style="display:flex; gap:8px; align-items:center">
                    <span id="userEmail" class="help mono"></span>
                    <button id="btnSignIn" class="btn primary">Entrar com Google</button>
                    <button id="btnSignOut" class="btn" style="display:none; color: #fff;">Sair</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="notAuth" style="padding: 20px; background: rgba(0,0,0,.2); border-radius: var(--radius); margin-bottom: 12px;">
            <strong>Faça login com sua conta Google para acessar o dashboard.</strong>
        </div>

        <div id="dashboard" class="hidden">
            <section class="toolbar" style="margin-bottom:12px">
                <input id="q" type="search" placeholder="Buscar por nome, e-mail ou telefone…" />
                <select id="filterOrigem" style="min-width:220px">
                    <option value="">Todas as origens</option>
                </select>
                <input id="filterDiscipulador" type="text" placeholder="Filtrar discipulador" />
                <select id="filterSexo" style="width:160px">
                    <option value="">Sexo (todos)</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Feminino">Feminino</option>
                </select>
                <button id="btnClearFilters" class="btn">Limpar filtros</button>
                <div style="margin-left:auto; display:flex; gap:8px;">
                    <button id="btnAdd" class="btn primary">+ Nova pessoa</button>
                </div>
            </section>

            <section class="grid">
                <div class="card">
                    <h3>Total de pessoas</h3>
                    <div class="num" id="kpiTotal">0</div>
                    <div class="chips" id="chipsOrigens"></div>
                </div>
                <div class="card">
                    <h3>Por sexo</h3>
                    <div class="row" style="margin-top:6px">
                        <span class="mono">Masc: <b id="kpiMasc">0</b> </span><span class="mono">Fem: <b id="kpiFem">0</b> </span>
                    </div>
                </div>
                <div class="card">
                    <h3>Iniciados (últimos 30 dias)</h3>
                    <div class="num" id="kpi30">0</div>
                </div>

                <div class="table-card" style="grid-column:1 / -1; margin-top:12px;">
                    <div style="padding:10px 12px; display:flex; gap:8px; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,.04)">
                        <div style="display:flex; gap:8px; align-items:center;">
                            <input id="importFile" type="file" accept=".json" />
                            <button id="btnImport" class="btn">Importar JSON</button>
                            <button id="btnExport" class="btn ok">Exportar JSON</button>
                            <button id="btnSeed" class="btn" title="Inserir alguns dados de exemplo">Gerar exemplos</button>
                            <button id="btnWipe" class="btn warn" title="Apagar tudo">Apagar tudo</button>
                        </div>
                    </div>

                    <table id="tbl" style="width:100%">
                        <thead>
                            <tr>
                                <th data-sort="nome" class="sortable">Nome</th>
                                <th class="w-120">Sexo</th>
                                <th class="w-120">Nascimento</th>
                                <th>Endereço</th>
                                <th class="w-160">Telefone</th>
                                <th class="w-120">E-mail</th>
                                <th class="w-160">Origem</th>
                                <th class="w-160">Discipulador</th>
                                <th class="w-160 nowrap" data-sort="dataInicio">Início</th>
                                <th class="w-160">Ações</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </div>

        <dialog id="dlg">
            <form method="dialog" id="frm">
                <div class="modal-header">
                    <strong id="dlgTitle">Nova pessoa</strong>
                    <button value="close" class="btn" type="button" id="btnClose">Fechar</button>
                </div>
                <div class="modal-body form-signup-person">
                    <div style="display:grid; grid-template-columns:repeat(6,1fr); gap:10px">
                        <div style="grid-column:span 6"><input class="field" id="fNome" required placeholder="Nome" maxlength="50" /></div>
                        <div style="grid-column:span 2"><select class="field" id="fSexo" required><option value="" disabled selected>Sexo</option><option>Masculino</option><option>Feminino</option></select></div>
                        <div style="grid-column:span 2"><input class="field" id="fNascimento" type="text" required placeholder="Nascimento" onfocus="this.type = 'date'; this.max = new Date().toISOString().split('T')[0]; this.showPicker();" onblur="if(!this.value)this.type='text'" /></div>
                        <div style="grid-column:span 2">
                            <select class="field" id="fEstadoCivil" required>
                                <option value="" disabled selected>Estado civil</option>
                                <option>Casado(a)</option>
                                <option>Solteiro(a)</option>
                                <option>Viúvo(a)</option>
                                <option>Divorciado(a)</option>
                                <option>Separado(a)</option>
                                <option>União estável</option>
                            </select>
                        </div>
                        <div style="grid-column:span 2"><input class="field" id="fCEP" placeholder="CEP" required maxlength="9" /></div>
                        <div style="grid-column:span 2"><input class="field" id="fEnderecoNumero" placeholder="Número" required maxlength="10" /></div>
                        <div style="grid-column:span 2"><input class="field" id="fComlemento" placeholder="Complemento" maxlength="50" /></div>
                        <div style="grid-column:span 6"><input class="field" id="fEndereco" placeholder="Endereço" readonly disabled style="color: darkgray;" /></div>
                        <div style="grid-column:span 6"><input class="field" id="fTelefone" placeholder="Telefone (DDD)9XXXXXXXX" required maxlength="11" /></div>
                        <div style="grid-column:span 6"><input class="field" id="fEmail" type="email" placeholder="E-mail" maxlength="50" /></div>
                        <div style="grid-column:span 6"><select class="field" id="fOrigem" required></select></div>
                        <div style="grid-column:span 6"><input class="field" id="fDiscipulador" placeholder="Discipulador" required maxlength="50" /></div>
                        <div style="grid-column:span 6"><input class="field" id="fDataInicio" type="text" required placeholder="Início" onfocus="this.type = 'date'; this.showPicker();" onblur="if(!this.value)this.type='text'" /></div>

                        <div style="grid-column:span 6"><div class="help danger" id="errors" style="display:none; margin-top:6px"></div></div>
                    </div>
                </div>
                <div class="footer">
                    <button class="btn" value="cancel" type="button" id="btnCancel">Cancelar</button>
                    <button class="btn primary" id="btnSave" type="submit">Salvar</button>
                </div>
                <script type="text/javascript">
                    document.querySelector('#fCEP').oninput = function () {
                        if (this.value && this.value.trim()) {
                            var cep = this.value.trim().replace(/\D/gi, '');
                            if (cep.length == 8) {
                                this.disabled = true;
                                fetch(`https://brasilapi.com.br/api/cep/v1/${cep}`)
                                    .then(r => r.json())
                                    .then(r => {
                                        document.querySelector('#fEndereco').value = r.street +
                                            (r.neighborhood ? (' - ' + r.neighborhood) : '') +
                                            (r.city ? (' - ' + r.city) : '') +
                                            (r.state ? (' - ' + r.state) : '');
                                    })
                                    .catch(e => {
                                        this.value = '';
                                        document.querySelector('#fEndereco').value = '';
                                        alert('CEP não encontrado');
                                    })
                                    .finally(() => {
                                        this.disabled = false;
                                    });
                            }
                        }
                    }
                </script>
            </form>
        </dialog>
    </main>

    <script type="module">
        const firebaseConfig = {
            apiKey: "AIzaSyAs8v-6HuK-iqlpOT1ktUNTLALCcDKchzY",
            authDomain: "piba-beta.firebaseapp.com",
            projectId: "piba-beta"
            // storageBucket, messagingSenderId, appId
        };
        // ----------------------------------------------------------------

        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
        import {
            getFirestore, collection, doc, addDoc, setDoc, getDocs, query, orderBy, where, deleteDoc, getDoc, writeBatch
        } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const db = getFirestore(app);

        /* ===== Config/estado ===== */
        const STORAGE_KEY = "dashboard_pessoas_v1"; // apenas para compatibilidade local (não usado para persistência principal)
        const ORIGENS = [
            { text: "Primeiro contato com a igreja", selected: 'selected', disabled: 'disabled' },
            { value: 1, text: "Convite de um amigo(a)" },
            { value: 2, text: "Conversão" },
            { value: 3, text: "Transferência de igreja/congregação" },
            { value: 4, text: "Evangelismo na rua" },
            { value: 5, text: "Folheto" },
            { value: 6, text: "Mídias sociais" },
            { value: 7, text: "Evento/Conferência" },
            { value: 8, text: "Visita domiciliar" },
            { value: 9, text: "Projeto social" },
            { value: 10, text: "Culto online" },
            { value: 11, text: "Site" }
        ];

        let pessoas = []; // cache local dos docs carregados
        let sort = { field: "nome", dir: "asc" };
        let editingId = null;
        let currentUser = null; // objeto user do Firebase
        let userBasePath = null; // ex: users/{uid}/pessoas

        const byId = id => document.getElementById(id);
        const fmtDate = iso => { if (!iso) return ""; const d = new Date(iso); if (Number.isNaN(d)) return iso; return d.toLocaleDateString("pt-BR"); };
        const parseDate = v => { const d = new Date(v); return isNaN(d) ? null : d.toISOString(); };
        const sanitizePhone = v => (v || "").replace(/[^\d]/g, "");
        const formatPhoneBR = v => { const d = sanitizePhone(v); if (d.length < 10) return v || ""; const dd = d.length === 11 ? d.replace(/^(\d{2})(\d{5})(\d{4}).*/, "($1) $2-$3") : d.replace(/^(\d{2})(\d{4})(\d{4}).*/, "($1) $2-$3"); return dd; };
        const whatsappLink = v => { const d = sanitizePhone(v); if (d.length < 10) return null; return `https://wa.me/55${d}`; };
        const uid = () => crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
        const compare = (a, b, f) => { const va = (a?.[f] ?? "").toString().toLowerCase(); const vb = (b?.[f] ?? "").toString().toLowerCase(); if (va < vb) return -1; if (va > vb) return 1; return 0; };

        function populateOrigemSelects() {
            const sel = byId("fOrigem");
            sel.innerHTML = ORIGENS.map(o => `<option value="${o.value || ''}" ${o.selected || ''} ${o.disabled || ''}>${o.text}</option>`).join("");
            const f = byId("filterOrigem");
            f.innerHTML = `<option value="">Todas as origens</option>` + ORIGENS.map(o => `<option value="${o.value}">${o.text}</option>`).join("");
        }

        function renderTable() {
            const tbody = document.querySelector("#tbl tbody");
            const q = byId("q").value.trim().toLowerCase();
            const filtroOrigem = byId("filterOrigem").value;
            const filtroDiscip = byId("filterDiscipulador").value.trim().toLowerCase();
            const filtroSexo = byId("filterSexo").value;

            let list = [...pessoas];

            if (q) {
                const qDigits = q.replace(/[^\d]/g, "");
                list = list.filter(p => (p.nome || "").toLowerCase().includes(q) || (p.email || "").toLowerCase().includes(q) || sanitizePhone(p.telefone).includes(qDigits));
            }
            if (filtroOrigem) list = list.filter(p => p.origem === filtroOrigem);
            if (filtroDiscip) list = list.filter(p => (p.discipulador || "").toLowerCase().includes(filtroDiscip));
            if (filtroSexo) list = list.filter(p => p.sexo === filtroSexo);

            // Ordenação
            list.sort((a, b) => {
                const f = sort.field;
                if (f === "dataInicio") {
                    const va = a.dataInicio || "";
                    const vb = b.dataInicio || "";
                    return sort.dir === "asc" ? va.localeCompare(vb) : vb.localeCompare(va);
                }
                const r = compare(a, b, f);
                return sort.dir === "asc" ? r : -r;
            });

            tbody.innerHTML = list.map(p => {
                const telFmt = formatPhoneBR(p.telefone);
                const wpp = whatsappLink(p.telefone);
                const sexoTag = p.sexo === "Masculino" ? "m" : p.sexo === "Feminino" ? "f" : "o";
                return `<tr>
                          <td><div style="display:flex;flex-direction:column"><strong>${p.nome || ""}</strong><span class="mono">${(p.id || "").slice(0, 8)}</span></div></td>
                          <td>${p.sexo || ""}</td>
                          <td>${p.nascimento ?? ""}</td>
                          <td>${p.endereco ?? ""}</td>
                          <td class="nowrap">${telFmt || ""}${wpp ? `<div><a href="${wpp}" target="_blank" rel="noopener" class="help">WhatsApp</a></div>` : ""}</td>
                          <td>${p.email ?? ""}</td>
                          <td>${p.origem ?? ""}</td>
                          <td>${p.discipulador ?? ""}</td>
                          <td class="nowrap">${fmtDate(p.dataInicio)}</td>
                          <td class="nowrap">
                            <button class="btn" onclick="onEdit('${p.id}')">Editar</button>
                            <button class="btn warn" onclick="onDelete('${p.id}')">Excluir</button>
                          </td>
                        </tr>`;
            }).join("");

            updateKPIs(list);
        }

        function updateKPIs(currentList) {
            byId("kpiTotal").textContent = pessoas.length;
            const masc = pessoas.filter(p => p.sexo === "Masculino").length;
            const fem = pessoas.filter(p => p.sexo === "Feminino").length;
            byId("kpiMasc").textContent = masc; byId("kpiFem").textContent = fem;
            const now = new Date();
            const last30 = pessoas.filter(p => { if (!p.dataInicio) return false; const d = new Date(p.dataInicio); return (now - d) <= (30 * 24 * 60 * 60 * 1000); }).length;
            byId("kpi30").textContent = last30;

            const counts = {};
            (currentList || pessoas).forEach(p => { if (!p.origem) return; counts[p.origem] = (counts[p.origem] || 0) + 1; });
            const chips = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k, v]) => `<span style="background:var(--bg2); color:var(--text); padding:6px 8px; border-radius:999px; margin-right:6px">${k}: <b>${v}</b></span>`).join("");
            byId("chipsOrigens").innerHTML = chips || `<span class="help">Sem dados</span>`;
        }



        // path base: users/{uid}/pessoas
        function pessoasCollectionRef() {
            if (!currentUser) throw new Error("Usuário não autenticado");
            return collection(db, `users/${currentUser.uid}/pessoas`);
        }

        async function loadPessoasFromFirestore() {
            if (!currentUser) return;
            pessoas = [];
            try {
                const q = query(pessoasCollectionRef(), orderBy("nome"));
                const snap = await getDocs(q);
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    pessoas.push({
                        id: docSnap.id,
                        nome: data.nome,
                        sexo: data.sexo,
                        nascimento: data.nascimento,
                        endereco: data.endereco,
                        telefone: data.telefone,
                        email: data.email,
                        origem: data.origem,
                        discipulador: data.discipulador,
                        dataInicio: data.dataInicio ? data.dataInicio : null
                    });
                });
                renderTable();
            } catch (err) {
                console.error("Erro ao carregar pessoas:", err);
                alert("Falha ao carregar dados: " + err.message);
            }
        }

        async function savePessoaToFirestore(p) {
            if (!currentUser) throw new Error("Usuário não autenticado");
            try {
                const pCol = pessoasCollectionRef();
                if (!p.id) {
                    // add
                    const toAdd = { ...p };
                    const docRef = await addDoc(pCol, {
                        nome: toAdd.nome || "",
                        sexo: toAdd.sexo || "",
                        nascimento: toAdd.nascimento || null,
                        endereco: toAdd.endereco || "",
                        telefone: toAdd.telefone || "",
                        email: toAdd.email || "",
                        origem: toAdd.origem || "",
                        discipulador: toAdd.discipulador || "",
                        dataInicio: toAdd.dataInicio || null
                    });
                    p.id = docRef.id;
                } else {
                    // set (replace fields)
                    const docRef = doc(db, `users/${currentUser.uid}/pessoas/${p.id}`);
                    await setDoc(docRef, {
                        nome: p.nome || "",
                        sexo: p.sexo || "",
                        nascimento: p.nascimento || null,
                        endereco: p.endereco || "",
                        telefone: p.telefone || "",
                        email: p.email || "",
                        origem: p.origem || "",
                        discipulador: p.discipulador || "",
                        dataInicio: p.dataInicio || null
                    }, { merge: true });
                }
                await loadPessoasFromFirestore();
            } catch (err) {
                console.error("savePessoaToFirestore error:", err);
                alert("Erro ao salvar: " + err.message);
            }
        }

        async function deletePessoaFromFirestore(id) {
            if (!currentUser) throw new Error("Usuário não autenticado");
            try {
                const docRef = doc(db, `users/${currentUser.uid}/pessoas/${id}`);
                await deleteDoc(docRef);
                await loadPessoasFromFirestore();
            } catch (err) {
                console.error("delete error:", err);
                alert("Erro ao excluir: " + err.message);
            }
        }

        /* ===== CRUD UI glue (similar ao original) ===== */
        function openModal(edit = false) { byId("dlgTitle").textContent = edit ? "Editar pessoa" : "Nova pessoa"; byId("errors").style.display = "none"; byId("frm").reset?.(); byId("dlg").showModal(); }
        function closeModal() { byId("dlg").close(); }

        function onCreate() {
            editingId = null;
            byId("fNome").value = "";
            byId("fSexo").value = "";
            byId("fNascimento").value = "";
            byId("fEndereco").value = "";
            byId("fTelefone").value = "";
            byId("fEmail").value = "";
            byId("fOrigem").value = ORIGENS[0];
            byId("fDiscipulador").value = "";
            byId("fDataInicio").value = "";
            openModal(false);
        }

        function onEdit(id) {
            const p = pessoas.find(x => x.id === id);
            if (!p) return;
            editingId = id;
            byId("fNome").value = p.nome || "";
            byId("fSexo").value = p.sexo || "";
            byId("fNascimento").value = p.nascimento ?? "";
            byId("fEndereco").value = p.endereco || "";
            byId("fTelefone").value = p.telefone || "";
            byId("fEmail").value = p.email || "";
            byId("fOrigem").value = p.origem || ORIGENS[0];
            byId("fDiscipulador").value = p.discipulador || "";
            byId("fDataInicio").value = p.dataInicio || "";
            openModal(true);
        }

        async function onDelete(id) {
            const p = pessoas.find(x => x.id === id);
            if (!p) return;
            if (confirm(`Excluir "${p.nome}"? Esta ação não pode ser desfeita.`)) {
                await deletePessoaFromFirestore(id);
            }
        }

        function validateForm(data) {
            const errs = [];
            if (!data.nome || data.nome.trim().length < 2) errs.push("Informe um nome válido.");
            if (!data.sexo) errs.push("Selecione o sexo.");
            if (!data.nascimento) errs.push("Informe o nascimento");
            if (data.nascimento !== "" && (new Date() < new Date(data.nascimento))) errs.push("Nascimento inválido.");
            if (data.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) errs.push("E-mail inválido.");
            if (!data.origem) errs.push("Selecione a origem.");
            if (!data.dataInicio) errs.push("Informe a data de início.");
            return errs;
        }

        async function onSave(e) {
            e?.preventDefault?.();
            const data = {
                id: editingId || null,
                nome: byId("fNome").value.trim(),
                sexo: byId("fSexo").value,
                nascimento: byId("fNascimento").value.trim(),
                endereco: byId("fEndereco").value.trim(),
                telefone: byId("fTelefone").value.trim(),
                email: byId("fEmail").value.trim(),
                origem: byId("fOrigem").value,
                discipulador: byId("fDiscipulador").value.trim(),
                dataInicio: byId("fDataInicio").value
            };
            const errs = validateForm(data);
            const box = byId("errors");
            if (errs.length) {
                box.textContent = errs.join(" ");
                box.style.display = "block";
                return;
            } else box.style.display = "none";

            await savePessoaToFirestore(data);
            closeModal();
        }

        /* ===== Import/Export/Seed/Wipe (atuam sobre coleção do usuário) ===== */
        function exportJSON() {
            const blob = new Blob([JSON.stringify(pessoas, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = "pessoas.json"; a.click();
            URL.revokeObjectURL(url);
        }

        function importJSON(file) {
            if (!file) { alert("Selecione um arquivo JSON."); return; }
            const reader = new FileReader();
            reader.onload = async () => {
                try {
                    const data = JSON.parse(reader.result);
                    if (!Array.isArray(data)) throw new Error("Formato inválido");
                    if (!confirm(`Importar ${data.length} registros para seu usuário atual?`)) return;
                    // adicionar como novos docs
                    for (const p of data) {
                        const toAdd = {
                            nome: p.nome || "",
                            sexo: p.sexo || "",
                            nascimento: p.nascimento || null,
                            endereco: p.endereco || "",
                            telefone: p.telefone || "",
                            email: p.email || "",
                            origem: p.origem || "",
                            discipulador: p.discipulador || "",
                            dataInicio: p.dataInicio || null
                        };
                        await addDoc(pessoasCollectionRef(), toAdd);
                    }
                    await loadPessoasFromFirestore();
                    alert("Importação concluída.");
                } catch (err) {
                    alert("Falha ao importar: " + err.message);
                }
            };
            reader.readAsText(file);
        }

        async function seed() {
            if (!confirm("Inserir dados de exemplo na sua coleção?")) return;
            const today = new Date();
            const iso = d => new Date(d).toISOString().split('T')[0];
            const addDays = (n) => new Date(today.getTime() + n * 86400000);
            const examples = [
                { nome: "Ana Souza", sexo: "Feminino", nascimento: iso(new Date(1990, 9, 25)), endereco: "Rua das Flores, 123 - Curitiba", telefone: "(41) 99876-1234", email: "ana.souza@email.com", origem: "Mídias sociais", discipulador: "Priscila", dataInicio: iso(addDays(-3)) },
                { nome: "Carlos Lima", sexo: "Masculino", nascimento: iso(new Date(1991, 9, 25)), endereco: "Av. Brasil, 450 - São Paulo", telefone: "(11) 91234-5678", email: "carlos.lima@email.com", origem: "Indicação de amigo(a)", discipulador: "João", dataInicio: iso(addDays(-15)) },
                { nome: "Beatriz Almeida", sexo: "Feminino", nascimento: iso(new Date(1992, 9, 25)), endereco: "Rua 7 de Setembro, 77 - Porto Alegre", telefone: "(51) 99111-2233", email: "", origem: "Evento/Conferência", discipulador: "Marina", dataInicio: iso(addDays(-40)) },
                { nome: "Rafael Santos", sexo: "Masculino", nascimento: iso(new Date(1993, 9, 25)), endereco: "Av. Atlântica, 900 - Rio de Janeiro", telefone: "(21) 98888-0000", email: "rafa.santos@email.com", origem: "Conversão", discipulador: "Pedro", dataInicio: iso(addDays(-1)) },
                { nome: "João Pedro", sexo: "Masculino", nascimento: iso(new Date(1994, 9, 25)), endereco: "Rua A, 10 - Recife", telefone: "(81) 98765-4321", email: "", origem: "Projeto social", discipulador: "Lucas", dataInicio: iso(addDays(-5)) }
            ];
            for (const ex of examples) {
                await addDoc(pessoasCollectionRef(), ex);
            }
            await loadPessoasFromFirestore();
        }

        async function wipe() {
            if (!confirm("Tem certeza que deseja apagar TODOS os registros da sua coleção? Esta ação não pode ser desfeita.")) return;
            // apagar em batch (Firestore não tem deleteMany; usamos batch)
            try {
                const snap = await getDocs(pessoasCollectionRef());
                const batch = writeBatch(db);
                snap.forEach(d => batch.delete(doc(db, `users/${currentUser.uid}/pessoas/${d.id}`)));
                await batch.commit();
                await loadPessoasFromFirestore();
            } catch (err) {
                console.error("wipe error:", err);
                alert("Erro ao apagar: " + err.message);
            }
        }

        /* ===== Eventos e boot ===== */

        function attachEvents() {
            byId("btnAdd").addEventListener("click", onCreate);
            byId("btnClose").addEventListener("click", closeModal);
            byId("btnCancel").addEventListener("click", closeModal);
            byId("frm").addEventListener("submit", onSave);

            byId("q").addEventListener("input", renderTable);
            byId("filterOrigem").addEventListener("change", renderTable);
            byId("filterDiscipulador").addEventListener("input", renderTable);
            byId("filterSexo").addEventListener("change", renderTable);
            byId("btnClearFilters").addEventListener("click", () => { byId("q").value = ""; byId("filterOrigem").value = ""; byId("filterDiscipulador").value = ""; byId("filterSexo").value = ""; renderTable(); });

            byId("btnExport").addEventListener("click", exportJSON);
            byId("btnImport").addEventListener("click", () => importJSON(byId("importFile").files?.[0]));
            byId("btnSeed").addEventListener("click", seed);
            byId("btnWipe").addEventListener("click", wipe);

            document.querySelectorAll("th[data-sort]").forEach(th => {
                th.title = "Clique para ordenar";
                th.addEventListener("click", () => {
                    const f = th.dataset.sort;
                    sort = { field: f, dir: (sort.field === f && sort.dir === "asc") ? "desc" : "asc" };
                    renderTable();
                });
            });

            byId("fTelefone").addEventListener("blur", e => e.target.value = formatPhoneBR(e.target.value));

            // auth buttons
            byId("btnSignIn").addEventListener("click", async () => {
                try {
                    await signInWithPopup(auth, provider);
                } catch (err) { console.error("signin error", err); alert("Erro no login: " + err.message); }
            });
            byId("btnSignOut").addEventListener("click", async () => {
                await signOut(auth);
            });
        }

        // auth state observer
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            const notAuth = byId("notAuth"), dashboard = byId("dashboard"), userEmail = byId("userEmail"), btnSignIn = byId("btnSignIn"), btnSignOut = byId("btnSignOut");
            if (user) {
                if (['YldGeVkyOXpjM1pxY21OdmJVQm5iV0ZwYkM1amIyMD0='].includes(btoa(btoa(user.email)))) {
                    userEmail.textContent = user.displayName || user.email || "";
                    btnSignIn.style.display = "none"; btnSignOut.style.display = "inline-block";
                    notAuth.style.display = "none"; dashboard.classList.remove("hidden");
                    userBasePath = `users/${user.uid}/pessoas`;
                    populateOrigemSelects();
                    await loadPessoasFromFirestore();
                }
            } else {
                userEmail.textContent = "";
                btnSignIn.style.display = "inline-block"; btnSignOut.style.display = "none";
                notAuth.style.display = "block"; dashboard.classList.add("hidden");
                pessoas = []; renderTable();
            }
        });

        // boot
        (function init() {
            populateOrigemSelects();
            attachEvents();
        })();

        // expose some functions to global scope because table buttons call them inline
        window.onEdit = onEdit;
        window.onDelete = (id) => onDelete(id);
    </script>
</body>
</html>
